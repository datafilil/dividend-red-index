name: 红利指数日报（生成 + 推送线上）

# 触发方式（GitHub Actions cron 用 UTC，北京 = UTC+8）：
#   工作日北京 23:30 / 23:50 各一次 —— 中证官网当日数据常延迟到 23:00 才更新，
#   故分两次、留一次补跑。数据未前进时脚本产出旧日期报告，线上 /ingest 会拒绝
#   （stored=false），重复触发安全，不会把新报告覆盖回旧版本。
on:
  schedule:
    - cron: '30 15 * * 1-5'   # 北京 23:30
    - cron: '50 15 * * 1-5'   # 北京 23:50（补跑）
  workflow_dispatch:  # 仓库 Actions 页可手动点 "Run workflow" 触发
    inputs:
      force:
        description: '强制全量重跑（忽略"官网数据未前进就跳过"预检；平日手动触发无需勾选）'
        type: boolean
        default: false

# 只读即可：报告不再提交回仓库（公开 Pages 已下线），线上内容由 Cloudflare KV 承载。
permissions:
  contents: read

# 同一时间只跑一个
concurrency:
  group: dividend-report
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout 仓库（含 cache 缓存种子）
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖（xlrd）
        run: pip install -r requirements.txt

      - name: 运行取数与报告生成脚本
        id: run
        env:
          # 手动触发时若勾选 force，则跳过"数据未前进"预检强制全量重跑
          FORCE_RUN: ${{ inputs.force && '1' || '' }}
        run: python dividend_index_reminder.py

      # 关键：CI 里不持有任何 Cloudflare 凭据。
      # 报告 POST 给线上 Worker 的 /ingest，由 Worker 用它自己的 KV 绑定写库；
      # CI 只需要 INGEST_TOKEN 一个共享口令（与 Worker 端同名 secret 一致）。
      - name: 推送到线上（Worker /ingest → KV）
        if: steps.run.outputs.report_updated == 'true'
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: |
          grep -o "生成日期：[0-9-]*" dividend_index_report.html | head -1
          python push_ingest.py dividend_index_report.html

      # 顺带把"全市场扫描"结果推进 KV —— 这是整条链路唯一的重活，
      # 线上 Worker 自己跑它会撞 128MB 上限。推给它之后，Worker 每天 cron
      # 都能命中缓存，不再重扫，从而具备自主日更能力。
      # 失败不影响主流程（报告已经推成功），故 continue-on-error。
      - name: 推送全市场扫描缓存（Worker 据此免于自扫）
        if: steps.run.outputs.report_updated == 'true'
        continue-on-error: true
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: python push_ingest.py --scan cache/add_candidates.json
