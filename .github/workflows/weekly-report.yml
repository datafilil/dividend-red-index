name: 红利指数日报（生成 + 推送线上）

# 触发方式（GitHub Actions cron 用 UTC，北京 = UTC+8）：
#   GitHub 自带 schedule：北京 19:00–23:50 每 25 分钟（UTC 11:00–15:50）。这是 Worker dispatch 之外的“最后备份”。
#   报告实际生成时点由脚本内三重门控决定，与触发频率解耦：
#   - 时间门控：每天 19:26(北京)起才取数——官网数据傍晚~深夜放出(实测首现 17:01~23:21, 中位≈19:30)，19:26 前完全不取数；
#   - 收敛锚点：首探到官网更新后 +30 分钟才跑全量，规避 perf/indicator/成分 分批发布的早期数据不全；
#   - 今日锁：当天数据取到并出报后, 当日剩余 cron 早退, 不再空转。
#   本 workflow 的 concurrency 串行化 + report_updated/today_done 守卫可防并发 push 竞态。
#   另：Worker cron(7-16 北京)也会每 25 分钟经 repository_dispatch 叫醒本 workflow（见 di_deploy/wrangler.toml），
#   两条独立触发通道互为冗余；Worker 白天 dispatch 会被脚本“时间门控”早退拦截。
on:
  schedule:
    # 北京 19:00–23:50 每 25 分钟（UTC 11:00–15:50）；19:26 前由脚本“时间门控”早退, 19:00/19:25 两轮为无操作占位。
    # 数据最晚实测 23:21 放出, 故 23:50 前覆盖；节假日延至次日中午的数据, 当天 19:00 后轮次即可捕获。
    - cron: '0,25,50 11-15 * * *'
  repository_dispatch:  # 由 Cloudflare Worker cron 经 GitHub API 叫醒（冗余通道）
    types: [trigger-weekly-report]
  workflow_dispatch:  # 仓库 Actions 页可手动点 "Run workflow" 触发
    inputs:
      force:
        description: '强制全量重跑（忽略"官网数据未前进就跳过"预检；平日手动触发无需勾选）'
        type: boolean
        default: false

# 改为可写：生成报告后把 index.html 提交回仓库，让 GitHub Pages 自动重建。
# 你已能正常打开 github.io（只是旧），用它作“稳定可访问的镜像”；线上 Worker+KV 仍保留作备份。
permissions:
  contents: write

# 同一时间只跑一个
concurrency:
  group: dividend-report
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout 仓库（含 cache 缓存种子）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要完整历史以便下方 git push 提交 index.html

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖（xlrd）
        run: pip install -r requirements.txt

      - name: 运行取数与报告生成脚本
        id: run
        env:
          # 手动触发时若勾选 force，则跳过"数据未前进"预检强制全量重跑
          FORCE_RUN: ${{ inputs.force && '1' || '' }}
        run: python dividend_index_reminder.py

      # 关键：CI 里不持有任何 Cloudflare 凭据。
      # 报告 POST 给线上 Worker 的 /ingest，由 Worker 用它自己的 KV 绑定写库；
      # CI 只需要 INGEST_TOKEN 一个共享口令（与 Worker 端同名 secret 一致）。
      - name: 推送到线上（Worker /ingest → KV）
        if: steps.run.outputs.report_updated == 'true'
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: |
          grep -o "生成日期：[0-9-]*" dividend_index_report.html | head -1
          python push_ingest.py dividend_index_report.html

      # 顺带把"全市场扫描"结果推进 KV —— 这是整条链路唯一的重活，
      # 线上 Worker 自己跑它会撞 128MB 上限。推给它之后，Worker 每天 cron
      # 都能命中缓存，不再重扫，从而具备自主日更能力。
      # 失败不影响主流程（报告已经推成功），故 continue-on-error。
      - name: 推送全市场扫描缓存（Worker 据此免于自扫）
        if: steps.run.outputs.report_updated == 'true'
        continue-on-error: true
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: python push_ingest.py --scan cache/add_candidates.json

      # 把生成结果写回仓库：①让 GitHub Pages 自动重建；②回写扫描缓存种子。
      # index.html：仅当报告日期真正前进（report_updated）才更新，避免无意义提交；
      #   且 commit message 改用报告“生成日期”（取 dividend_index_report.html 里的“生成日期：YYYY-MM-DD”），
      #   不再用运行日，消除“10/1 跑出 9/30 数据”的日期歧义。
      # cache/add_candidates.json：始终尝试回写。fetch_add_candidates() 带 7 天守卫，
      #   种子新鲜时 CI 直接读缓存、不重扫；陈旧时才重扫并刷新种子(generated=当天)。
      #   回写仓库可避免“种子卡在旧日期 → 每次 CI 都重扫 91 页”的浪费（原瑕疵）。
      # 线上 Worker+KV 仍保留作备份。
      - name: 回写仓库（Pages index.html + 扫描缓存种子）
        # 今日锁命中(today_done=true)时彻底跳过回写: 当天数据已齐, 不再产生任何 git 操作
        if: steps.run.outcome == 'success' && steps.run.outputs.today_done != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 报告：仅数据前进时回写 index.html
          if [ "${{ steps.run.outputs.report_updated }}" = "true" ]; then
            cp dividend_index_report.html index.html
            git add index.html
          fi
          # 扫描缓存种子：始终尝试回写（7 天守卫保证不会每日重扫）。
          # 收敛锚点 anchor.json：记录“首次探测到官网更新的时点”，供脚本跨 CI 任务收敛到 +30min。
          # 注意：.gitignore 含 cache/，已追踪文件也需 -f 才能 add（否则被 ignore 拒绝并报错）。
          #       anchor.json 仅在“首次探测到更新”的轮询中才生成，故用 [ -f ] 守卫避免文件缺失时报错。
          git add -f cache/add_candidates.json
          [ -f cache/anchor.json ] && git add -f cache/anchor.json
          # 今日锁状态: 出报那轮写入, 供后续 cron 命中后早退(跨日自动解锁)
          [ -f cache/done_today.json ] && git add -f cache/done_today.json
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            if [ "${{ steps.run.outputs.report_updated }}" = "true" ]; then
              GEN=$(grep -oP "生成日期：\K[0-9-]+" dividend_index_report.html | head -1)
              MSG="chore: 自动更新日报 ${GEN}"
            else
              MSG="chore: 刷新扫描缓存种子 $(TZ=Asia/Shanghai date +%F)"
            fi
            git commit -m "$MSG"
            git push https://x-access-token:${GITHUB_TOKEN}@github.com/datafilil/dividend-red-index.git HEAD:main
          fi
