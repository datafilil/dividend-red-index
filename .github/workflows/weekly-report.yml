name: 红利指数日报

# 触发方式：周一至周五 北京时间 15:28–23:58 每 10 分钟轮询(取到官网当日数据即出报告) + 支持手动触发
# 轮询不必担心空跑：脚本内置轻量预检，官网数据日期未前进时一次 HTTP 即退出，
# 只有"官网当日数据发布后的第一次触发"才会跑全量取数(全市场扫描等)，当天后续触发全部秒退。
on:
  schedule:
    # GitHub Actions cron 用 UTC；北京 15:28–23:58 = UTC 07:28–15:58；周一至五 = 1-5
    # 分针固定 28/38/48/58，避开 :00/:30(GitHub 调度高峰，整点/半点易被延迟或丢弃)
    - cron: '28,38,48,58 7-15 * * 1-5'
  workflow_dispatch:  # 仓库 Actions 页可手动点 "Run workflow" 触发
    inputs:
      force:
        description: '强制全量重跑（忽略"官网数据未前进就跳过"预检；平日手动触发无需勾选）'
        type: boolean
        default: false

# 自动提交需要写权限
permissions:
  contents: write

# 同一时间只跑一个，避免并发提交冲突
concurrency:
  group: dividend-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout 仓库（含 cache 缓存种子）
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖（xlrd）
        run: pip install -r requirements.txt

      - name: 运行取数与报告生成脚本
        id: run
        env:
          # 手动触发时若勾选 force，则跳过"数据未前进"预检强制全量重跑
          FORCE_RUN: ${{ inputs.force && '1' || '' }}
        run: python dividend_index_reminder.py

      - name: 同步报告到 Pages 根目录
        if: steps.run.outputs.report_updated == 'true'
        run: |
          cp dividend_index_report.html index.html
          mkdir -p site
          cp dividend_index_report.html site/index.html
          echo "--- 报告产物 ---"
          ls -la index.html site/index.html

      - name: 提交更新（缓存增量 + 历史快照 + 报告 + site）
        if: steps.run.outputs.report_updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "本轮无变更（官网未更新），跳过提交"
          else
            git commit -m "chore: 红利指数周报 $(date -u +%Y-%m-%d)"
            # 拉取远程最新提交并 rebase(避免外部 PUT 推送与本地 commit 冲突导致 push 被拒)
            git pull --rebase "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ${GITHUB_REF_NAME}
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:${GITHUB_REF_NAME}
            echo "已提交并推送"
          fi
