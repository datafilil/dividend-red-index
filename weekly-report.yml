name: 红利指数日报

# 触发方式：每周一至周五 15:28 北京时间起，每 10 分钟重试一次（应对官网数据延迟，可能当晚 23:00 才更新）
on:
  schedule:
    # GitHub Actions cron 用 UTC；北京时间 15:28 = UTC 07:28；周一到周五 = 1-5 (0=周日)
    # 时延严重：官网当日数据可能延迟至 23:00 才更新，故自 15:28 起每 10 分钟重试，直到取到当日收盘与估值
    # 第一段覆盖 15:28–15:58 北京(UTC 07:28/38/48/58)；第二段覆盖 16:00–23:50 北京(UTC 08–15 每 10 分)
    - cron: '10 15 * * 1-5'   # 自动收敛: 轮询确认当日数据后锁定到安全下限(北京23:10)
  workflow_dispatch:  # 仓库 Actions 页可手动点 "Run workflow" 触发

# 自动提交需要写权限
permissions:
  contents: write

# 同一时间只跑一个，避免并发提交冲突
concurrency:
  group: dividend-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout 仓库（含 cache 缓存种子）
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖（xlrd）
        run: pip install -r requirements.txt

      - name: 运行取数与报告生成脚本
        run: python dividend_index_reminder.py

      - name: 同步报告到 Pages 根目录
        run: |
          cp dividend_index_report.html index.html
          mkdir -p site
          cp dividend_index_report.html site/index.html
          echo "--- 报告产物 ---"
          ls -la index.html site/index.html

      - name: 提交更新（缓存增量 + 报告 + site）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "本轮无变更（官网未更新），跳过提交"
          else
            git commit -m "chore: 红利指数周报 $(date -u +%Y-%m-%d)"
            # 拉取远程最新提交并 rebase(避免外部 PUT 推送与本地 commit 冲突导致 push 被拒)
            git pull --rebase "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ${GITHUB_REF_NAME}
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:${GITHUB_REF_NAME}
            echo "已提交并推送"
          fi
